<path d="M48 40h42" stroke="#60a5fa" stroke-width="5"/>
<text x="106" y="46" fill="#c5cddb" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">BY OBEOS</text>
<text x="48" y="114" fill="#60a5fa" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">ASSURANCE / 06</text>
<text x="45" y="194" fill="#f3f5fa" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">ProofBoard</text>
<text x="48" y="247" fill="#e0e6ef" font-family="Arial, sans-serif" font-size="25">Every claim, tied to its evidence</text>
<text x="48" y="285" fill="#99a7bc" font-family="Arial, sans-serif" font-size="21">Seal the evidence. Find out when it goes missing, changes, fails or goes stale.</text>
