<text x="48" y="366" fill="#99a7bc" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">LOCAL SYSTEMS. CLEAR PURPOSE.</text>
<text x="1106" y="366" fill="#60a5fa" font-family="Arial, sans-serif" font-size="17" font-weight="700">5K</text>
