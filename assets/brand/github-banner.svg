<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">ProofBoard — Every claim, tied to its evidence</title><desc id="desc">A ledger that links each claim to sealed evidence files and tells you when one is missing, changed, failing or stale. By OBEOS.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
