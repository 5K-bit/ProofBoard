  </defs>
  <rect width="880" height="240" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="237" rx="26.5" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="3"/>
