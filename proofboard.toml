[board]
title = "ProofBoard"
subject = "proofboard 0.1.1"
default_max_age_days = 180

[[claim]]
id = "tests-pass"
title = "The test suite passes with at least 90% coverage"
statement = "The recorded run of the whole suite finished with no failures and a coverage floor above 90%."

  [[claim.evidence]]
  path = "docs/evidence/test-run.txt"
  contains = "passed"
  not_contains = "failed"
  coverage_min = 90

[[claim]]
id = "no-runtime-deps"
title = "No runtime dependencies"
statement = "The package declares an empty dependency list; development tools are an optional extra."

  [[claim.evidence]]
  path = "pyproject.toml"
  matches = '^dependencies = \[\]$'

[[claim]]
id = "drift-is-caught"
title = "A changed evidence file is caught, and sealing will not hide it"
statement = "The recorded demo shows a drifted claim and a refused re-seal."

  [[claim.evidence]]
  path = "docs/evidence/acceptance-transcript.txt"
  contains = [
    "1 drifted, 3 passed",
    "These sealed files have changed. Nothing was written.",
    "4 claims: 4 stale",
  ]

[[claim]]
id = "hostile-input"
title = "Hostile claims, locks and evidence are handled"
statement = "Unsafe paths, XML entities (including re-encoded documents), markup in text and 300 mutated claims files are covered by tests that are part of the recorded run."

  [[claim.evidence]]
  path = "tests/unit/test_render_fuzz.py"
  contains = ["test_hostile_text_is_inert", "test_fuzzed_claims_files_never_crash"]

  [[claim.evidence]]
  path = "tests/unit/test_model_checks.py"
  contains = ["test_unsafe_paths_rejected", "test_xml_with_doctype_or_entities_refused", "test_encoded_entities_refused", "test_junit_cannot_contradict_itself"]

  [[claim.evidence]]
  path = "tests/unit/test_xml_encodings.py"
  contains = ["test_entities_are_refused_in_every_encoding", "test_ebcdic_declared_encoding_is_refused"]

[[claim]]
id = "threat-model"
title = "The limits of what a seal shows are written down"
statement = "The threat model and security policy state that ProofBoard detects change, not dishonesty."

  [[claim.evidence]]
  path = "docs/threat-model.md"
  contains = "Honesty of the evidence"

  [[claim.evidence]]
  path = "SECURITY.md"
  contains = "It detects change, not dishonesty."

# ---------------------------------------------------------------------------------------------
# This repository's own case study: `proofboard casestudy --format html --out docs/evidence/casestudy.html`
# Every sentence below cites a file in this repository and is sealed and checked like a claim.

[casestudy]
title = "ProofBoard: claims tied to evidence you can re-check"
subject = "proofboard 0.1.1"
author = "Louis Boddie"
summary = "A small command-line tool that links each claim about a project to the evidence files behind it, seals their SHA-256, and reports when that evidence changes, goes missing, fails a rule or goes stale."
repo = "https://github.com/5K-bit/ProofBoard"

[[story]]
section = "problem"
text = "The evidence behind a claim can be edited, deleted or left to age while the claim keeps being repeated, and nothing in a normal repository notices. The recorded demo walks one made-up project through exactly those three failures."
  [[story.evidence]]
  path = "docs/evidence/acceptance-transcript.txt"
  contains = [
    "== 4. Someone edits the restore drill after the fact ==",
    "== 7. The review note is deleted ==",
    "== 8. Evidence goes stale ==",
  ]

[[story]]
section = "evidence"
text = "In that recording all four claims read passed after sealing; after the restore drill is edited one reads drifted and a repeat seal is refused; after enough time all four read stale."
  [[story.evidence]]
  path = "docs/evidence/acceptance-transcript.txt"
  contains = [
    "4 claims: 4 passed",
    "1 drifted, 3 passed",
    "These sealed files have changed. Nothing was written.",
    "4 claims: 4 stale",
  ]

[[story]]
section = "decision"
text = "Evidence is sealed by SHA-256 rather than by file time, because modification times change on every checkout and can be set by anyone."
  [[story.evidence]]
  path = "docs/adr/0001-seal-by-hash-not-by-timestamp.md"
  contains = "modification times change on every checkout"

[[story]]
section = "decision"
text = "Sealing refuses to overwrite a changed hash unless told the change is expected, so the seal command cannot be used to turn a red board green by accident."
  [[story.evidence]]
  path = "docs/adr/0002-seal-refuses-silent-changes.md"
  contains = "--accept-changes"

[[story]]
section = "decision"
text = "Rules are data, not code: a claims file cannot run a command, so editing it in a pull request is not the same as running code in CI."
  [[story.evidence]]
  path = "docs/adr/0003-rules-are-data-not-code.md"
  contains = "equivalent to running code in CI"

[[story]]
section = "implementation"
text = "A strict claims-file parser, a hash ledger with its own digest, a pure planner for sealing, and an evaluator that gives each claim the worst status among its evidence, with text, Markdown, HTML and JSON reports."
  [[story.evidence]]
  path = "docs/architecture.md"
  contains = ["`ledger.py`", "`seal.py`", "`evaluate.py`"]

[[story]]
section = "verification"
text = "The recorded run of the test suite passed with coverage above 90%."
  [[story.evidence]]
  path = "docs/evidence/test-run.txt"
  matches = '\b\d+ passed\b'
  coverage_min = 90

[[story]]
section = "verification"
text = "Hostile claims files and evidence are covered by tests: unsafe paths, XML with entities (also when re-encoded as UTF-16), markup in text, and mutated claims files."
  [[story.evidence]]
  path = "tests/unit/test_render_fuzz.py"
  contains = ["test_hostile_text_is_inert", "test_fuzzed_claims_files_never_crash"]
  [[story.evidence]]
  path = "tests/unit/test_model_checks.py"
  contains = ["test_unsafe_paths_rejected", "test_xml_with_doctype_or_entities_refused"]
  [[story.evidence]]
  path = "tests/unit/test_xml_encodings.py"
  contains = ["test_entities_are_refused_in_every_encoding"]

[[story]]
section = "limits"
text = "A seal proves a file is what it was when sealed, not that it was honest; a sealed false log reads as passed."
  [[story.evidence]]
  path = "README.md"
  contains = "Unchanged is not true."

[[story]]
section = "limits"
text = "The lock is tamper-evident, not signed: anyone who can rewrite both the lock and the evidence can make a board green."
  [[story.evidence]]
  path = "README.md"
  contains = "tamper-evident, not signed"

[[story]]
section = "limits"
text = "It has only been tried on made-up projects, and not yet by hand on Windows."
  [[story.evidence]]
  path = "README.md"
  contains = ["Tested on made-up projects.", "Not yet verified on Windows by hand."]
