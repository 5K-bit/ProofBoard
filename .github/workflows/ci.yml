name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (with coverage floor)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --cov --cov-fail-under=90 2>&1 | tee pytest.log || {
            # Surface the end of the log as an annotation, readable without signing in.
            echo "::error title=pytest failed::$(tail -c 3500 pytest.log | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }

  acceptance:
    name: demo project (installed CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without development tools
        run: python -m pip install .
      - name: Seal and check the demo project
        run: |
          cp -r examples/demo /tmp/demo
          proofboard seal -C /tmp/demo
          proofboard check -C /tmp/demo
          proofboard board -C /tmp/demo --format html --out /tmp/board.html

  self-check:
    name: this repository's own claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Every claim about ProofBoard is backed by sealed evidence
        run: proofboard check
      - name: The case study is fully proven and renders
        run: |
          proofboard casestudy --strict --format html --out /tmp/casestudy.html
          proofboard casestudy --strict --format md --out /tmp/casestudy.md

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: |
          python -m pip install -e . pip-audit
          pip-audit
